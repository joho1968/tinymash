[tinymash]
; Example layout:
;   site definition  /var/www/example
;   installation     /var/www/example/tinymash
;   document root    /var/www/example/tinymash/public
user = www-data
group = www-data

listen = /run/php/php8.4-fpm-tinymash.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

; Give every installation its own writable temporary root.
; sys_temp_dir is preferred; TMP, TMPDIR, and TEMP are ordered fallbacks.
php_admin_value[sys_temp_dir] = /var/www/example/tmp
env[TMP] = /var/www/example/tmp
env[TMPDIR] = /var/www/example/tmp
env[TEMP] = /var/www/example/tmp

; upload_tmp_dir is used only for PHP upload staging.
php_admin_value[upload_tmp_dir] = /var/www/example/tmp
; Allow the complete installation plus only site-level paths used by PHP.
; Nginx-only paths such as /var/www/example/_auth do not belong here.
php_admin_value[open_basedir] = /var/www/example/tinymash:/var/www/example/tmp:/var/www/example/logs:/tmp:/dev/urandom:/proc/meminfo
php_admin_value[include_path] = .:/usr/share/php

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_reporting] = E_ALL
php_admin_value[error_log] = /var/www/example/logs/php.log

php_admin_value[memory_limit] = 32M
php_admin_value[max_execution_time] = 30
php_admin_value[max_input_time] = 60

php_admin_value[post_max_size] = 64M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[max_file_uploads] = 20

php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Strict

; Give each tinymash installation a distinct, stable session name.
; Replace TINYMASHEXAMPLE with a short site-specific value that starts with a letter.
php_admin_value[session.name] = TINYMASHEXAMPLE

; Session data expires after this many inactive seconds. Set this globally or per pool.
; php_admin_value[session.gc_maxlifetime] = 28800

; Optional Redis-backed sessions. Use a distinct prefix for each site sharing the database.
; php_admin_value[session.save_handler] = redis
; php_admin_value[session.save_path] = tcp://127.0.0.1:6379?database=0&prefix=TINYMASHEXAMPLE:

; Enable this only when the site is served over HTTPS.
; php_admin_flag[session.cookie_secure] = on

php_admin_value[cgi.fix_pathinfo] = 0

; Enable OPcache in the FPM INI layer, for example with php-opcache-production.ini.
; Do not try to enable it here after an earlier INI layer disabled it.
php_admin_flag[opcache.validate_timestamps] = 0
php_admin_value[opcache.revalidate_freq] = 0
php_admin_value[opcache.file_update_protection] = 0
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_flag[opcache.save_comments] = 1
php_admin_flag[opcache.jit] = 0
php_admin_value[opcache.jit_buffer_size] = 0
